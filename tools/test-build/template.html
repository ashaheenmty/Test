<script>
const DATA = /*__DATA__*/;
(function () {
'use strict';
const BRAND = 'Durch Deutschland';
const S = TB.defaultSettings;
const LEGAL_VERSION = '2026-09-draft';
const FEE_RULES = [
  { id: 'fee-long-distance', name: 'Long-distance trains: €1.00 per ticket', kind: 'FIXED_PER_TICKET', category: 'LONG_DISTANCE_RAIL', amountMinor: 100 },
  { id: 'fee-intercity', name: 'Between cities (regional rail): €0.50 per ticket', kind: 'FIXED_PER_TICKET', category: 'INTERCITY_REGIONAL', amountMinor: 50 },
  { id: 'fee-local-bus', name: 'Buses and city transport: €0.10 per ticket', kind: 'FIXED_PER_TICKET', category: 'LOCAL_AND_BUS', amountMinor: 10 },
  { id: 'fee-booking-cap', name: 'Maximum €1.00 per booking', kind: 'BOOKING_CAP', category: null, amountMinor: 100 },
].map((r) => ({ percentBp: null, minMinor: null, maxMinor: null, priority: 0, active: true, ...r }));
const OPS = DATA.ops;
const OP_BY = Object.fromEntries(OPS.map((o) => [o.s, o]));

// ───────────── helpers ─────────────
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const i18nCache = {};
function T(locale) {
  i18nCache[locale] ??= TB.createI18n(locale, { defaultVariables: { brand: BRAND } }).t;
  return i18nCache[locale];
}
const eur = (minor, locale = 'de') => new Intl.NumberFormat(TB.LOCALES[locale]?.intlLocale || locale, { style: 'currency', currency: 'EUR' }).format(minor / 100);
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable: session-only */ } },
};

// ───────────── simulated backend state (this browser only) ─────────────
const KEY = 'dd-testbuild-v1';
let db = store.get(KEY, null);
async function freshState() {
  const s = { users: [], session: null, outbox: [], tokens: {}, opOverrides: {}, audit: [], locale: 'de', theme: 'system' };
  const anna = { id: uid(), email: 'anna@example.com', pw: await sha256('demo passphrase 2026'), verified: true, locale: 'de', theme: 'SYSTEM', failed: 0, lockedUntil: 0,
    travellers: [{ id: uid(), first: 'Anna', last: 'Schmidt', holder: true, dob: '1988-04-12' }, { id: uid(), first: 'Jonas', last: 'Schmidt', holder: false, dob: '2016-09-03' }] };
  s.users.push(anna);
  s.session = anna.id;
  return s;
}
function save() { store.set(KEY, db); }

let auditChain = Promise.resolve();
function audit(actorType, actorId, action, entityType, entityId, data = {}) {
  auditChain = auditChain.then(async () => {
    const prev = db.audit.length ? db.audit[db.audit.length - 1].hash : '0'.repeat(64);
    const e = { id: db.audit.length + 1, occurredAt: new Date().toISOString(), actorType, actorId, action, entityType, entityId, data };
    e.prevHash = prev;
    e.hash = await sha256(prev + TB.canonicalJson({ ...e, prevHash: undefined, id: undefined }));
    db.audit.push(e); save();
    if (ui.area === 'admin') render();
  });
  return auditChain;
}
async function verifyChain() {
  let prev = '0'.repeat(64);
  for (const e of db.audit) {
    if (e.prevHash !== prev) return { ok: false, at: e.id, why: 'link to previous entry is broken' };
    const h = await sha256(prev + TB.canonicalJson({ ...e, prevHash: undefined, id: undefined, hash: undefined }));
    if (h !== e.hash) return { ok: false, at: e.id, why: 'content was changed after it was written' };
    prev = e.hash;
  }
  return { ok: true, checked: db.audit.length };
}

// ───────────── UI state ─────────────
const ui = { area: 'app', route: 'home', flash: null, drawer: null, keep: {}, admin: { role: 'SUPER_ADMIN', tab: 'ops', q: '', seg: '', region: '', status: '', page: 1, sel: null, verify: null }, fee: null };
const me = () => db.users.find((u) => u.id === db.session) || null;
const loc = () => db.locale;
const t = (k, v) => T(loc())(k, v);
function go(route, flash = null, keep = {}) { ui.route = route; ui.flash = flash; ui.keep = keep; ui.area = 'app'; render(); $('#stage').scrollIntoView({ block: 'start' }); }
function setTheme(v) {
  db.theme = v; save();
  if (v === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
}

// ───────────── simulated API (mirrors apps/api rules) ─────────────
function sendMail(user, purpose) {
  const token = uid() + uid();
  db.tokens[token] = { userId: user.id, purpose, used: false, exp: Date.now() + S.auth.emailTokenTtlMinutes * 60000 };
  const tt = T(user.locale || 'de');
  const holder = user.travellers.find((x) => x.holder)?.first || '';
  const prefix = purpose === 'VERIFY' ? 'email.verify' : 'email.reset';
  const link = `https://durch-deutschland.example/${user.locale}/${purpose === 'VERIFY' ? 'verify-email' : 'reset-password'}?token=${token.slice(0, 12)}…`;
  db.outbox.unshift({ id: uid(), to: user.email, subject: tt(prefix + 'Subject'), text: tt(prefix + 'Body', { name: holder, link, minutes: S.auth.emailTokenTtlMinutes }), token, purpose, at: Date.now() });
  save(); updateCounts();
}
const api = {
  async register(f) {
    const parsed = TB.registerSchema.safeParse({ ...f, locale: loc(), acceptedAgentTermsVersion: LEGAL_VERSION, acceptedPrivacyPolicyVersion: LEGAL_VERSION });
    if (!f.accept) return 'auth.mustAcceptTerms';
    if (!parsed.success) return parsed.error.issues.some((i) => i.message === 'password.tooShort') ? 'auth.passwordTooShort' : 'common.errorGeneric';
    const v = parsed.data;
    if (db.users.some((u) => u.email === v.email)) return 'auth.emailTaken';
    const u = { id: uid(), email: v.email, pw: await sha256(v.password), verified: false, locale: loc(), theme: 'SYSTEM', failed: 0, lockedUntil: 0, travellers: [{ id: uid(), first: v.firstName, last: v.lastName, holder: true, dob: null }] };
    db.users.push(u); db.session = u.id; save();
    audit('USER', u.id, 'user.registered', 'User', u.id, { acceptedAgentTerms: LEGAL_VERSION, acceptedPrivacyPolicy: LEGAL_VERSION, locale: loc() });
    sendMail(u, 'VERIFY');
    return null;
  },
  async login(email, pw) {
    const u = db.users.find((x) => x.email === email.trim().toLowerCase());
    if (u && u.lockedUntil > Date.now()) return 'auth.rateLimited';
    if (!u || (await sha256(pw)) !== u.pw) {
      if (u) {
        u.failed += 1;
        if (u.failed >= 10) { u.failed = 0; u.lockedUntil = Date.now() + 15 * 60000; audit('SYSTEM', null, 'auth.account_locked', 'User', u.id); }
        else audit('SYSTEM', null, 'auth.login_failed', 'User', u.id);
        save();
      }
      return 'auth.invalidCredentials';
    }
    u.failed = 0; u.lockedUntil = 0; db.session = u.id; save();
    audit('USER', u.id, 'auth.login', 'User', u.id, { method: 'password' });
    return null;
  },
  forgot(email) { const u = db.users.find((x) => x.email === email.trim().toLowerCase()); if (u) sendMail(u, 'RESET'); },
  consume(token, purpose) {
    const r = db.tokens[token];
    if (!r || r.used || r.purpose !== purpose || r.exp < Date.now()) return null;
    r.used = true; save(); return db.users.find((u) => u.id === r.userId);
  },
  async reset(token, pw) {
    if (!pw || pw.length < 10) return 'auth.passwordTooShort';
    const u = this.consume(token, 'RESET'); if (!u) return 'common.errorGeneric';
    u.pw = await sha256(pw); u.verified = true; u.failed = 0; u.lockedUntil = 0;
    if (db.session === u.id) db.session = null; save();
    audit('USER', u.id, 'auth.password_reset', 'User', u.id);
    return null;
  },
  verify(token) { const u = this.consume(token, 'VERIFY'); if (!u) return 'common.errorGeneric'; u.verified = true; save(); audit('USER', u.id, 'user.email_verified', 'User', u.id); return null; },
};

  return `<div class="tool stack-lg">${head}${a.tab === 'ops' ? adminOps() : adminAudit()}</div>`;
}
function adminOps() {
  const a = ui.admin; const q = a.q.trim().toLowerCase();
  let rows = OPS.filter((o) => (!q || o.n.toLowerCase().includes(q) || (o.g || '').toLowerCase().includes(q) || o.b.some((b) => b.toLowerCase() === q)) && (!a.seg || o.sg.includes(a.seg)) && (!a.region || o.r.some((r) => r.toLowerCase() === a.region.trim().toLowerCase())) && (!a.status || opStatus(o) === a.status));
  rows = rows.sort((x, y) => x.n.localeCompare(y.n, 'de'));
  const pages = Math.max(1, Math.ceil(rows.length / 25)); a.page = Math.min(a.page, pages);
  const shown = rows.slice((a.page - 1) * 25, a.page * 25);
  const segs = ['LONG_DISTANCE', 'CROSS_BORDER', 'REGIONAL', 'CITY_TRANSIT', 'NIGHT', 'LONG_DISTANCE_BUS', 'HERITAGE'];
  const sel = a.sel && OP_BY[a.sel];
  return `<p class="muted" style="margin:0">${OPS.length} operators imported from your master list. Legal names are unverified; sales-channel coverage is an assumption until contracts exist.</p>
    <form class="filters" id="f-ops" role="search" onsubmit="return false">
      ${field('aq', 'Search', `<input id="aq" value="${esc(a.q)}" placeholder="Name, group or brand (e.g. alex)">`)}
      ${field('aseg', 'Segment', `<select id="aseg"><option value="">All</option>${segs.map((s) => `<option ${s === a.seg ? 'selected' : ''}>${s}</option>`).join('')}</select>`)}
      ${field('areg', 'Region', `<input id="areg" value="${esc(a.region)}" placeholder="DE-BY, AT, Berlin…">`)}
      ${field('ast', 'Status', `<select id="ast"><option value="">All</option>${['ACTIVE', 'INACTIVE', 'DISCONTINUED', 'NEEDS_REVIEW'].map((s) => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`)}
    </form>
    ${sel ? opDetail(sel) : ''}
    <div class="table-wrap"><table><thead><tr><th>Operator</th><th>Country</th><th>Status</th><th>Segments</th><th>Regions</th><th>Sold via</th></tr></thead><tbody>
      ${shown.map((o) => `<tr class="op-row" data-op-sel="${o.s}" tabindex="0"><td><button class="link-btn" style="min-height:0;padding:0" data-op-sel="${o.s}">${esc(o.n)}</button>${o.b.length ? `<div class="muted small">${esc(o.b.join(', '))}</div>` : ''}</td><td>${o.c}</td><td><span class="status status-${opStatus(o)}">${opStatus(o)}</span></td><td class="small">${esc(o.sg.join(', '))}</td><td class="small">${esc(o.r.join(', '))}</td><td class="small">${esc(o.ch.join(', ') || '—')}</td></tr>`).join('') || '<tr><td colspan="6">No operators match these filters.</td></tr>'}
    </tbody></table></div>
    <div class="pager"><span class="muted small">${rows.length} result(s)</span><div class="chips"><button class="button button-small" data-page="-1" ${a.page <= 1 ? 'disabled' : ''}>Previous</button><span class="small">Page ${a.page} of ${pages}</span><button class="button button-small" data-page="1" ${a.page >= pages ? 'disabled' : ''}>Next</button></div></div>`;
}
function opDetail(o) {
  const ov = db.opOverrides[o.s] || {};
  return `<section class="card" aria-label="${esc(o.n)}"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${esc(o.n)}</h2><button class="button button-small button-quiet" id="op-close">Close</button></div>
    <dl class="kv"><dt>Country / group</dt><dd>${o.c}${o.g ? ' · ' + esc(o.g) : ''}</dd><dt>Brands</dt><dd>${esc(o.b.join(', ') || '—')}</dd><dt>Transport modes</dt><dd>${esc(o.m.join(', '))}</dd><dt>Regions</dt><dd>${esc(o.r.join(', '))}</dd>${o.routes.length ? `<dt>Routes</dt><dd>${esc(o.routes.join(' · '))}</dd>` : ''}${o.ci.length ? `<dt>Cities (tariff)</dt><dd>${esc(o.ci.join(', '))}</dd>` : ''}<dt>Sold via</dt><dd>${esc(o.ch.join(', ') || 'No sales channel yet')}</dd>${o.notes.length ? `<dt>Notes from the sheet</dt><dd>${esc(o.notes.join(' · '))}</dd>` : ''}</dl>
    <form id="f-op" class="row" style="align-items:flex-end">${field('op-status', 'Status', `<select id="op-status" ${can('OPS') ? '' : 'disabled'}>${['ACTIVE', 'INACTIVE', 'DISCONTINUED', 'NEEDS_REVIEW'].map((s) => `<option ${s === opStatus(o) ? 'selected' : ''}>${s}</option>`).join('')}</select>`)}${field('op-notes', 'Internal note', `<input id="op-notes" value="${esc(ov.notes || '')}" ${can('OPS') ? '' : 'disabled'}>`)}
    ${can('OPS') ? '<button class="button button-primary" type="submit">Save</button>' : '<p class="hint">Requires the Operations role.</p>'}</form>
    ${ov.savedAt ? `<p class="alert alert-success" role="status">Saved — recorded in the audit log.</p>` : ''}</section>`;
}
function adminAudit() {
  if (!can('SUPPORT', 'OPS')) return '<p class="alert alert-error" role="alert">Your role (Content) cannot view the audit log.</p>';
  const v = ui.admin.verify;
  const rows = [...db.audit].reverse().slice(0, 100);
  return `<p class="muted" style="margin:0">Every account and back-office action is written here. Each entry is fingerprinted together with the one before it, so any later change is detectable. In the real system the database refuses edits and deletions outright.</p>
    <div class="row">${can() ? '<button class="button button-primary" id="verify">Verify chain</button><button class="button" id="tamper">Simulate tampering</button>' : '<p class="hint">Verifying the chain requires the Super admin role.</p>'}</div>
    ${v ? `<p class="alert ${v.ok ? 'alert-success' : 'alert-error'}" role="status">${v.ok ? `Chain intact — ${v.checked} entries verified.` : `Chain broken at entry #${v.at}: ${esc(v.why)}.`}</p>` : ''}
    <div class="table-wrap"><table><thead><tr><th class="num">#</th><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th><th>Fingerprint</th></tr></thead><tbody>
    ${rows.map((e) => `<tr><td class="num">${e.id}</td><td class="small" style="white-space:nowrap">${esc(e.occurredAt.replace('T', ' ').slice(0, 19))}</td><td class="small">${esc(e.actorType)}</td><td class="mono">${esc(e.action)}</td><td class="small">${esc(e.entityType)}</td><td class="mono" style="max-width:18rem">${esc(JSON.stringify(e.data))}</td><td class="mono">${esc(e.hash.slice(0, 10))}…</td></tr>`).join('') || '<tr><td colspan="7">No entries yet. Sign in, register or change an operator to create some.</td></tr>'}
    </tbody></table></div>`;
}

// ───────────── drawers: guide, inbox, feedback ─────────────
const GUIDE = [
  ['Accounts', [
    ['reg', 'Register a new account (use any email). Check the Inbox for the confirmation email and open its link.'],
    ['short', 'Try registering with a password under 10 characters, or without ticking the terms.'],
    ['dup', 'Register again with an email that already exists (anna@example.com).'],
    ['login', 'Sign out, then sign in again. Try a wrong password.'],
    ['lock', 'Enter a wrong password 10 times: the account is locked for 15 minutes.'],
    ['reset', 'Use “Passwort vergessen?”, open the reset email from the Inbox and set a new password.'],
  ]],
  ['Profile', [
    ['trav', 'Add a traveller with a date of birth, then delete one.'],
    ['lang', 'Switch to Arabic (العربية): the layout mirrors right-to-left. Try all 7 languages.'],
    ['theme', 'Switch between light, dark and system appearance.'],
    ['legal', 'Open Impressum, AGB and the other legal pages in the footer.'],
  ]],
  ['Service fee', [
    ['fees', 'Open the Fee calculator and try the examples. Check the €1.00 cap and the tier of each transport type.'],
  ]],
  ['Back-office', [
    ['ops', 'Filter operators (e.g. region DE-BY, segment REGIONAL, search “alex”). Open one and change its status.'],
    ['roles', 'Switch the role to Content or Support and see what changes.'],
    ['audit', 'Open the audit log, verify the chain, then simulate tampering and verify again.'],
  ]],
];
function renderDrawer() {
  const d = ui.drawer; const el = $('#drawer');
  if (!d) { el.hidden = true; $('#layout').classList.remove('with-drawer'); return; }
  el.hidden = false; $('#layout').classList.add('with-drawer');
  const close = '<button class="d-close" data-drawer-close type="button">Close</button>';
  if (d === 'guide') {
    const done = store.get('dd-guide', {});
    el.innerHTML = `<div class="d-head"><h2>Test guide</h2>${close}</div>
      <p class="small muted" style="margin:0">This is a test build of phase 1. Accounts, emails and changes are simulated and stay in your browser. Journey search and booking come in phase 2.</p>
      <div class="guide">${GUIDE.map(([h, items]) => `<h3>${h}</h3><ul>${items.map(([id, txt]) => `<li><label><input type="checkbox" data-guide="${id}" ${done[id] ? 'checked' : ''}><span>${esc(txt)}</span></label></li>`).join('')}</ul>`).join('')}</div>
      <p class="small muted">Found something to improve? Use <strong>Feedback</strong> in the top bar. It records which screen you were on.</p>
      <button class="button button-small" id="reset-data" type="button">Reset test data</button> <span id="reset-confirm"></span>`;
  } else if (d === 'inbox') {
    el.innerHTML = `<div class="d-head"><h2>Inbox (simulated)</h2>${close}</div>
      <p class="small muted" style="margin:0 0 .75rem">Emails the app would send. Open a link to continue the flow.</p>
      ${db.outbox.map((m) => `<article class="mail"><div class="fb-meta"><span>To ${esc(m.to)}</span><span>${new Date(m.at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</span></div><strong>${esc(m.subject)}</strong><pre>${esc(m.text)}</pre><button class="button button-small button-primary" data-mail="${m.id}" type="button">Open link</button></article>`).join('') || '<p class="muted">No emails yet. Register an account or request a password reset.</p>'}`;
  } else if (d === 'feedback') {
    el.innerHTML = feedbackPanel();
  }
}
function screenName() {
  if (ui.area === 'fees') return 'Fee calculator';
  if (ui.area === 'admin') return 'Back-office · ' + (ui.admin.tab === 'ops' ? 'Operators' : 'Audit log');
  const names = { home: 'Home', login: 'Sign in', register: 'Register', forgot: 'Forgot password', reset: 'Reset password', verify: 'Verify email', profile: 'Profile', bookings: 'Bookings' };
  return 'App · ' + (ui.route.startsWith('legal:') ? 'Legal: ' + ui.route.slice(6) : names[ui.route] || ui.route) + ` (${loc()})`;
}

// Feedback: shared list via the `db` capability; falls back to this browser.
const fb = { db: null, user: null, items: [], local: store.get('dd-feedback-local', []), mode: 'loading', names: {}, error: null, draft: '' };
function feedbackPanel() {
  const items = fb.mode === 'shared' ? fb.items : fb.local;
  return `<div class="d-head"><h2>Feedback</h2><button class="d-close" data-drawer-close type="button">Close</button></div>
    <form id="f-fb" class="stack">
      <p class="small muted" style="margin:0">Screen: <strong>${esc(screenName())}</strong></p>
      <div class="field"><label for="fb-kind">Type</label><select id="fb-kind"><option>Improvement</option><option>Bug</option><option>Wording / translation</option><option>Design</option><option>Question</option></select></div>
      <div class="field"><label for="fb-text">What should change?</label><textarea id="fb-text" required maxlength="2000" placeholder="e.g. The language menu should show flags">${esc(fb.draft)}</textarea></div>
      <button class="button button-primary" type="submit">Add feedback</button>
      ${fb.error ? `<p class="alert alert-error" role="alert">${esc(fb.error)}</p>` : ''}
      <p class="hint">${fb.mode === 'shared' ? 'Shared with everyone who opens this page, and with Claude for the phase 2 refinement.' : fb.mode === 'local' ? 'Saved in this browser only (shared list unavailable here). Use Copy all and paste it into the chat.' : 'Connecting to the shared list…'}</p>
    </form>
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:1rem"><h3 class="eyebrow" style="margin:0">${items.length} item(s)</h3><button class="button button-small" id="fb-copy" type="button">Copy all</button></div>
    <div id="fb-copy-area" hidden><textarea id="fb-copy-text" readonly style="min-height:8rem;margin-top:.5rem"></textarea></div>
    <div>${items.map((x) => `<div class="fb"><div class="fb-meta"><span class="badge">${esc(x.kind)}</span><span>${esc(x.screen)}</span><span>${x.author ? esc(fb.names[x.author] || 'Someone') : 'You'}</span><span>${new Date(x.createdAt).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}</span></div><p>${esc(x.text)}</p></div>`).join('') || '<p class="muted small">No feedback yet. Add the first note above.</p>'}</div>`;
}
async function initFeedback() {
  try {
    const [dbc, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
    fb.user = user || null;
    if (!dbc) { fb.mode = 'local'; updateCounts(); if (ui.drawer === 'feedback') renderDrawer(); return; }
    fb.db = dbc; fb.mode = 'shared';
    dbc.collection('feedback').orderBy('createdAt', 'desc').limit(500).onSnapshot(async (snap) => {
      fb.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const ids = [...new Set(fb.items.map((x) => x.author).filter(Boolean))];
      if (fb.user && ids.length) {
        try { const ps = await fb.user.profiles(ids); for (const id of ids) fb.names[id] = ps?.[id]?.name || 'Someone'; } catch { /* names optional */ }
      }
      updateCounts();
      if (ui.drawer === 'feedback') renderDrawer();
    }, () => { fb.mode = 'local'; updateCounts(); if (ui.drawer === 'feedback') renderDrawer(); });
  } catch { fb.mode = 'local'; updateCounts(); }
}
async function addFeedback(kind, text) {
  const entry = { kind, text, screen: screenName(), locale: loc(), createdAt: Date.now(), status: 'open' };
  if (fb.mode === 'shared' && fb.db) {
    try {
      const id = fb.user ? await fb.user.id() : null;
      await fb.db.collection('feedback').add({ ...entry, author: id || null });
      fb.error = null; fb.draft = ''; return;
    } catch (e) {
      fb.error = e?.code === 'permission_denied' || e?.code === 'not_granted' ? 'You can view this page but not add to the shared list. Your note was saved in this browser instead.' : 'The shared list did not accept the note. It was saved in this browser instead.';
    }
  }
  fb.local.unshift({ ...entry, author: null }); store.set('dd-feedback-local', fb.local); fb.draft = '';
  if (fb.mode !== 'shared') fb.error = null;
}

// ───────────── render & events ─────────────
function updateCounts() {
  $('#inbox-count').textContent = db.outbox.length;
  $('#fb-count').textContent = fb.mode === 'shared' ? fb.items.length : fb.local.length;
}
function render() {
  const stage = $('#stage');
  stage.innerHTML = ui.area === 'fees' ? renderFees() : ui.area === 'admin' ? renderAdmin() : renderApp();
  document.querySelectorAll('[data-area]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.area === ui.area)));
  document.querySelectorAll('[data-drawer]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.drawer === ui.drawer)));
  updateCounts();
  if (ui.drawer === 'feedback') { const txt = $('#fb-text'); const draft = txt?.value; renderDrawer(); if (draft) $('#fb-text').value = draft; }
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('button, [data-op-sel]'); if (!el) return;
  const d = el.dataset;
  if (d.area) { ui.area = d.area; render(); return; }
  if (d.drawer) { ui.drawer = ui.drawer === d.drawer ? null : d.drawer; render(); renderDrawer(); return; }
  if ('drawerClose' in d) { ui.drawer = null; render(); renderDrawer(); return; }
  if (d.go) { go(d.go); return; }
  if (d.themeSet) { setTheme(d.themeSet); const u = me(); if (u) { u.theme = d.themeSet.toUpperCase(); save(); } render(); return; }
  if (d.del) { const u = me(); u.travellers = u.travellers.filter((x) => x.id !== d.del); save(); audit('USER', u.id, 'passenger.deleted', 'Passenger', d.del); go('profile'); return; }
  if (d.mail) {
    const m = db.outbox.find((x) => x.id === d.mail); ui.drawer = null; renderDrawer();
    ui.pendingToken = m.token; go(m.purpose === 'VERIFY' ? 'verify' : 'reset'); return;
  }
  if (d.preset !== undefined) { ui.fee = { tickets: structuredClone(PRESETS[+d.preset].tickets), preset: +d.preset }; render(); return; }
  if (d.mode) { const [i, m] = d.mode.split(':'); const tk = feeState().tickets[+i]; tk.modes = tk.modes.includes(m) ? tk.modes.filter((x) => x !== m) : [...tk.modes, m]; feeState().preset = null; render(); return; }
  if (d.rm !== undefined) { feeState().tickets.splice(+d.rm, 1); feeState().preset = null; render(); return; }
  if (d.atab) { ui.admin.tab = d.atab; ui.admin.verify = null; render(); return; }
  if (d.page) { ui.admin.page += +d.page; render(); return; }
  if (d.opSel) { ui.admin.sel = d.opSel; render(); $('#stage').scrollIntoView({ block: 'start' }); return; }
  switch (el.id) {
    case 'logout': { const u = me(); db.session = null; save(); audit('USER', u.id, 'auth.logout', 'User', u.id); go('home'); break; }
    case 'resend': sendMail(me(), 'VERIFY'); go('profile', ['success', 'auth.verifyEmailSent']); break;
    case 'do-verify': { const err = api.verify(ui.pendingToken || ''); go(err ? 'verify' : me() ? 'profile' : 'login', err ? ['error', err] : ['success', 'auth.emailVerified']); break; }
    case 'add-ticket': feeState().tickets.push({ op: 'db-fernverkehr', modes: ['HIGH_SPEED_RAIL'], fare: 49.9 }); feeState().preset = null; render(); break;
    case 'op-close': ui.admin.sel = null; render(); break;
    case 'verify': ui.admin.verify = await verifyChain(); render(); break;
    case 'tamper': if (db.audit.length) { const e = db.audit[Math.floor(db.audit.length / 2)]; e.data = { ...e.data, tampered: true }; save(); ui.admin.verify = null; render(); } break;
    case 'reset-data': { const c = $('#reset-confirm'); c.innerHTML = '<button class="button button-small button-primary" id="reset-yes" type="button">Yes, reset</button>'; break; }
    case 'reset-yes': { db = await freshState(); save(); store.set('dd-guide', {}); ui.route = 'home'; ui.flash = null; setTheme('system'); await seedAudit(); render(); renderDrawer(); break; }
    case 'fb-copy': {
      const items = fb.mode === 'shared' ? fb.items : fb.local;
      const text = items.map((x) => `[${x.kind}] ${x.screen}: ${x.text}`).join('\n');
      $('#fb-copy-area').hidden = false; const ta = $('#fb-copy-text'); ta.value = text;
      try { await navigator.clipboard.writeText(text); el.textContent = 'Copied'; } catch { ta.select(); el.textContent = 'Select and copy'; }
      break;
    }
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.matches('tr[data-op-sel]')) { ui.admin.sel = ev.target.dataset.opSel; render(); } });
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.matches('[data-lang]')) { db.locale = el.value; const u = me(); if (u) u.locale = el.value; save(); ui.flash = null; render(); return; }
  if (el.matches('[data-guide]')) { const g = store.get('dd-guide', {}); g[el.dataset.guide] = el.checked; store.set('dd-guide', g); return; }
  if (el.matches('[data-op]')) { feeState().tickets[+el.dataset.op].op = el.value; feeState().preset = null; render(); return; }
  if (el.matches('[data-fare]')) { feeState().tickets[+el.dataset.fare].fare = el.value; feeState().preset = null; render(); return; }
  if (el.id === 'role') { ui.admin.role = el.value; ui.admin.verify = null; render(); return; }
  if (['aseg', 'ast'].includes(el.id)) { ui.admin[el.id === 'aseg' ? 'seg' : 'status'] = el.value; ui.admin.page = 1; render(); }
});
let filterTimer;
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'fb-text') { fb.draft = el.value; return; }
  if (el.id === 'aq' || el.id === 'areg') {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => { ui.admin[el.id === 'aq' ? 'q' : 'region'] = el.value; ui.admin.page = 1; const pos = el.selectionStart; render(); const again = $('#' + el.id); again.focus(); again.setSelectionRange(pos, pos); }, 250);
  }
});
document.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target; const v = (id) => $('#' + id, f)?.value ?? '';
  switch (f.id) {
    case 'f-login': { const err = await api.login(v('email'), v('password')); err ? go('login', ['error', err], { email: v('email') }) : go('home'); break; }
    case 'f-register': {
      const data = { firstName: v('firstName'), lastName: v('lastName'), email: v('r-email'), password: v('r-password'), accept: $('#accept').checked };
      const err = await api.register(data); err ? go('register', ['error', err], data) : go('profile', ['success', 'auth.verifyEmailSent']); break;
    }
    case 'f-forgot': api.forgot(v('fg-email')); go('forgot', ['success', 'auth.resetRequested']); break;
    case 'f-reset': { const err = await api.reset(ui.pendingToken || '', v('np')); err ? go('reset', ['error', err]) : go('login', ['success', 'auth.passwordChanged']); break; }
    case 'f-trav': { const u = me(); const p = { id: uid(), first: v('p-first').trim(), last: v('p-last').trim(), holder: false, dob: v('p-dob') || null }; if (!p.first || !p.last) return; u.travellers.push(p); save(); audit('USER', u.id, 'passenger.created', 'Passenger', p.id); go('profile', ['success', 'profile.saved']); break; }
    case 'f-op': {
      const o = OP_BY[ui.admin.sel]; const before = opStatus(o);
      db.opOverrides[o.s] = { status: v('op-status'), notes: v('op-notes'), savedAt: Date.now() }; save();
      audit('ADMIN', ui.admin.role, 'admin.operator_updated', 'Organisation', o.s, { before: { status: before }, after: { status: v('op-status'), notes: v('op-notes') || null } });
      render(); break;
    }
    case 'f-fb': { const text = v('fb-text').trim(); if (!text) return; await addFeedback(v('fb-kind'), text); updateCounts(); renderDrawer(); break; }
  }
});

async function seedAudit() {
  const u = db.users[0];
  await audit('SYSTEM', null, 'seed.completed', 'System', 'seed', { operators: OPS.length });
  await audit('USER', u.id, 'user.registered', 'User', u.id, { acceptedAgentTerms: LEGAL_VERSION, acceptedPrivacyPolicy: LEGAL_VERSION, locale: 'de' });
  await audit('USER', u.id, 'auth.login', 'User', u.id, { method: 'password' });
}

async function start() {
  if (!db) { db = await freshState(); save(); await seedAudit(); }
  setTheme(db.theme || 'system');
  render(); renderDrawer();
  initFeedback();
}
start();
})();
</script>
